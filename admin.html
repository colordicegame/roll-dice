<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dice Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      width: 100%; max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 22px;
      color: #1a1a2e;
      margin-bottom: 6px;
    }
    p {
      font-size: 13px;
      color: #666;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
    }
    select {
      width: 100%;
      padding: 10px 14px;
      font-size: 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      background: white;
      color: #333;
      cursor: pointer;
      margin-bottom: 20px;
      appearance: auto;
    }
    select:focus { outline: none; border-color: #4a90e2; }
    .color-preview {
      width: 100%;
      height: 48px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 2px solid rgba(0,0,0,0.1);
      transition: background 0.3s;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #1a1a2e;
      color: white;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    button:hover { background: #2d2d5e; }
    button:active { transform: scale(0.98); }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    .status.success { background: #e6f4ea; color: #2e7d32; display: block; }
    .status.error { background: #fdecea; color: #c62828; display: block; }
    .current-ban {
      margin-top: 24px;
      padding: 12px 16px;
      background: #f8f8f8;
      border-radius: 8px;
      font-size: 13px;
      color: #555;
      border-left: 4px solid #4a90e2;
    }
    .current-ban span { font-weight: bold; color: #333; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎲 Dice Admin</h1>
    <p>Select a color to ban from the dice roller. Players will not be able to roll this color.</p>

    <label for="color-select">Banned Color</label>
    <select id="color-select" onchange="updatePreview()">
      <option value="">-- Select a color --</option>
      <option value="Red">Red</option>
      <option value="Orange">Orange</option>
      <option value="Yellow">Yellow</option>
      <option value="Green">Green</option>
      <option value="Blue">Blue</option>
      <option value="Purple">Purple</option>
    </select>

    <div class="color-preview" id="color-preview" style="background:#eee;"></div>

    <button onclick="submitColor()">Submit</button>

    <div class="status" id="status"></div>

    <div class="current-ban" id="current-ban" style="display:none">
      Currently banned: <span id="current-ban-value">—</span>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://uxwjbfxtgrpzghokaalq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_0ucBltPjUhSqrrpU82_URg_BkFVS1oj';
    const TABLE = 'dice color';

    const COLOR_MAP = {
      Red: '#e82020',
      Orange: '#ff8800',
      Yellow: '#f9c200',
      Green: '#1aaa1a',
      Blue: '#2277dd',
      Purple: '#8833bb',
    };

    async function fetchCurrentBan() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${encodeURIComponent(TABLE)}?select=color&limit=1`, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      });
      const data = await res.json();
      if (data && data.length > 0 && data[0].color) {
        document.getElementById('current-ban').style.display = 'block';
        document.getElementById('current-ban-value').textContent = data[0].color;
      }
    }

    function updatePreview() {
      const val = document.getElementById('color-select').value;
      document.getElementById('color-preview').style.background = val ? COLOR_MAP[val] : '#eee';
    }

    async function submitColor() {
      const color = document.getElementById('color-select').value;
      const status = document.getElementById('status');
      status.className = 'status';
      status.style.display = 'none';

      if (!color) {
        status.textContent = 'Please select a color first.';
        status.className = 'status error';
        return;
      }

      try {
        // Delete existing rows first, then insert new one
        await fetch(`${SUPABASE_URL}/rest/v1/${encodeURIComponent(TABLE)}?color=neq.null`, {
          method: 'DELETE',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        const res = await fetch(`${SUPABASE_URL}/rest/v1/${encodeURIComponent(TABLE)}`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ color })
        });

        if (res.ok) {
          status.textContent = `✓ "${color}" is now the banned color.`;
          status.className = 'status success';
          document.getElementById('current-ban').style.display = 'block';
          document.getElementById('current-ban-value').textContent = color;
        } else {
          const err = await res.json();
          throw new Error(err.message || 'Unknown error');
        }
      } catch (err) {
        status.textContent = '✗ Error: ' + err.message;
        status.className = 'status error';
      }
    }

    fetchCurrentBan();
  </script>
</body>
</html>
